# GitHub Actions workflow — installed into target repos by onboard-actions
name: Docker Image Drift Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.dockerfile"
      - "**/k8s/**"
      - "**/deploy/**"
      - "**/helm/**"
      - "**/chart/**"
      - "**/manifests/**"
      - "**/*deployment*.yaml"
      - "**/*deployment*.yml"

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  image-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: pip install -r .github/docker-image-drift-agent/requirements.txt

      - name: Run Docker Image Drift Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/docker-image-drift-agent/scripts/ci_analyze_pr.py
