apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-api
  template:
    metadata:
      labels:
        app: example-api
    spec:
      containers:
      - name: api
        image: node:20-alpine
        ports:
        - containerPort: 8080
