# Enterprise golden-image catalog
# Images must match repository prefix; digests are the approved pins.

approved_images:
  - repository: docker.io/library/python
    aliases:
      - python
    approved_tags:
      - "3.12-slim"
      - "3.11-slim"
    approved_digests:
      - sha256:placeholder_python_312_slim
    max_critical_cves: 0
    max_high_cves: 2
    require_non_root: true
    notes: "Approved Python slim base images"

  - repository: docker.io/library/node
    aliases:
      - node
    approved_tags:
      - "20-alpine"
      - "22-alpine"
    approved_digests:
      - sha256:placeholder_node_20_alpine
    max_critical_cves: 0
    max_high_cves: 3
    require_non_root: true
    notes: "Approved Node.js Alpine images"

  - repository: docker.io/library/alpine
    aliases:
      - alpine
    approved_tags:
      - "3.20"
      - "3.19"
    approved_digests: []
    max_critical_cves: 0
    max_high_cves: 1
    require_non_root: false
    notes: "Minimal Alpine base"

  - repository: gcr.io/distroless/static
    aliases:
      - gcr.io/distroless/static
    approved_tags:
      - "nonroot"
      - "latest"
    approved_digests: []
    max_critical_cves: 0
    max_high_cves: 0
    require_non_root: true
    notes: "Distroless static nonroot"

# Repositories explicitly blocked
blocked_images:
  - docker.io/library/ubuntu:latest
  - docker.io/library/centos:latest

# Default policy when image is not in catalog
default_policy:
  action: block
  message: "Image not in golden catalog. Request approval via #security-images."
